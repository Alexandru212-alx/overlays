<title>ReLife - Logo animat v2</title>
<style>
  /* Streamlabs: Browser Source -> Local File, Width 1080, Height 375 */
  @property --a { syntax:'<angle>'; inherits:false; initial-value:0deg; }
  :root{--red:#e11d2a;--red2:#ff3b47}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent}

  .wrap{position:absolute;inset:1.2vw 1.4vw;animation:enter 1.4s cubic-bezier(.2,1,.2,1) both}
  @keyframes enter{0%{opacity:0;transform:scale(.85);filter:blur(12px) brightness(3)}60%{opacity:1;filter:blur(0) brightness(1.4)}100%{transform:none;filter:none}}

  .frame{position:absolute;inset:0;border-radius:2.4vw;padding:.38vw;
    background:conic-gradient(from var(--a), rgba(255,40,50,.15) 0deg, #ff3b47 40deg, #fff 60deg, #ff3b47 80deg,
      rgba(255,40,50,.15) 140deg, rgba(255,40,50,.15) 180deg, #ff3b47 220deg, #fff 240deg, #ff3b47 260deg, rgba(255,40,50,.15) 320deg);
    animation:spin 3.2s linear infinite;filter:drop-shadow(0 0 1.4vw rgba(255,40,50,.85))}
  @keyframes spin{to{--a:360deg}}
  .box{position:relative;width:100%;height:100%;border-radius:2.05vw;overflow:hidden;background:#000}

  /* taste care se aprind */
  .keys{position:absolute;left:40.5%;top:56.6%;width:19.5%;height:6.6%;pointer-events:none}
  .key{position:absolute;width:5%;height:28%;border-radius:2px;background:#ff5a63;
    box-shadow:0 0 .6vw #ff3b47,0 0 1.4vw #ff3b47;opacity:0;animation:keyhit .35s ease-out forwards;mix-blend-mode:screen}
  @keyframes keyhit{0%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1)}}
  .kbglow{position:absolute;left:39%;top:55%;width:22%;height:10%;border-radius:50%;
    background:radial-gradient(ellipse, rgba(255,40,50,.55), transparent 70%);mix-blend-mode:screen;opacity:.35;transition:opacity .1s}

  /* ochii care lumineaza */
  .eye{position:absolute;width:2.2%;height:4.5%;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,60,70,.9) 30%, rgba(255,30,40,0) 70%);
    mix-blend-mode:screen;opacity:0}
  .eye::after{content:"";position:absolute;left:50%;top:50%;width:420%;height:12%;transform:translate(-50%,-50%);
    background:linear-gradient(90deg,transparent,rgba(255,80,90,.9),transparent);filter:blur(1px)}
  .eyes-on .eye{animation:eyes 1.6s ease-in-out 1}
  @keyframes eyes{0%{opacity:0}20%{opacity:1}60%{opacity:.9}100%{opacity:0}}

  /* terminale holografice */
  .term{position:absolute;top:13%;width:25%;height:66%;border-radius:.9vw;padding:1vw 1.1vw;
    background:linear-gradient(160deg, rgba(20,0,3,.78), rgba(60,0,8,.55));
    border:.18vw solid rgba(255,59,71,.75);
    box-shadow:0 0 1.6vw rgba(255,40,50,.55), inset 0 0 1.6vw rgba(255,40,50,.25);
    font-family:Consolas,"Cascadia Mono","Courier New",monospace;color:#ffd5d8;font-size:1.32vw;line-height:1.45;
    overflow:hidden;backdrop-filter:blur(3px);
    animation:holo 4s ease-in-out infinite}
  .term.l{left:3.5%;transform:perspective(60vw) rotateY(14deg)}
  .term.r{right:3.5%;transform:perspective(60vw) rotateY(-14deg);animation-delay:-2s}
  @keyframes holo{0%,100%{opacity:.92}50%{opacity:1}48%{opacity:.75}}
  .term::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);pointer-events:none}
  .term .hdr{display:flex;align-items:center;gap:.5vw;margin-bottom:.6vw;font-size:1.3vw;color:#ff8a92;letter-spacing:.15vw}
  .term .hdr b{width:.8vw;height:.8vw;border-radius:50%;background:#ff3b47;box-shadow:0 0 .6vw #ff3b47}
  .term .hdr b:nth-child(2){background:#ffb84d;box-shadow:0 0 .6vw #ffb84d}

<script>
/* ================= TEXTE (le poti schimba) =================
   {p}=rosu  {ok}=verde  {y}=auriu  {/}=inchide culoarea
   {PLAYERS} = numarul real de jucatori de pe server        */
const COD_SERVER = "vg6kre";
const TERMINAL_STANGA = [
  "{p}>{/} connect relife-romania",
  "{ok}[OK]{/} conexiune stabilita",
  "{p}>{/} status server",
  "{ok}ONLINE{/} · jucatori {y}{PLAYERS}{/}",
  "{p}>{/} load roleplay.exe",
  "{ok}[OK]{/} lumea te asteapta...",
];
const TERMINAL_DREAPTA = [
  "{p}>{/} referral --activ",
  "{y}+7 zile VIP{/} deblocat",
  "{p}>{/} spawn --car premium",
  "{ok}[OK]{/} masina livrata",
  "{p}>{/} join discord",
  "{y}discord.gg/ReLifeRp{/}",
];
/* ========================================================= */

const IMG_W = 2172, IMG_H = 724;
// zonele din poza (in pixeli pe imaginea originala)
const HAND_L = {x:925, y:340, w:140, h:100};
const HAND_R = {x:1070, y:340, w:145, h:100};
function placeHand(el, r){
  el.style.left = (r.x/IMG_W*100)+'%'; el.style.top = (r.y/IMG_H*100)+'%';
  el.style.width = (r.w/IMG_W*100)+'%'; el.style.height = (r.h/IMG_H*100)+'%';
  const inn = el.firstElementChild;
  inn.style.width = (IMG_W/r.w*100)+'%'; inn.style.height = (IMG_H/r.h*100)+'%';
  inn.style.left = (-r.x/r.w*100)+'%'; inn.style.top = (-r.y/r.h*100)+'%';
}
const hL = document.getElementById('handL'), hR = document.getElementById('handR');
placeHand(hL, HAND_L); placeHand(hR, HAND_R);

/* ---------- tastare: mana apasa + tasta se aprinde ---------- */
const keys = document.getElementById('keys'), kbg = document.getElementById('kbglow');
function press(left){
  const h = left ? hL : hR, o = left ? hR : hL;
  h.classList.remove('lift'); h.classList.add('press'); o.classList.add('lift');
  setTimeout(()=>{ h.classList.remove('press'); }, 70);
  setTimeout(()=>{ o.classList.remove('lift'); }, 120);
  const k = document.createElement('div'); k.className = 'key';
  k.style.left = (left ? 5+Math.random()*40 : 50+Math.random()*42)+'%';
  k.style.top = (Math.random()*70)+'%';
  keys.appendChild(k); setTimeout(()=>k.remove(), 400);
  kbg.style.opacity = .8; setTimeout(()=>kbg.style.opacity=.35, 90);
}

/* ---------- terminale care se scriu ---------- */
let players = 'live';
async function getPlayers(){
  for (const base of ['https://frontend.cfx-services.net/api/servers/single/','https://servers-frontend.fivem.net/api/servers/single/']){
    try{ const r = await fetch(base+COD_SERVER,{cache:'no-store'}); if(!r.ok) continue;
      const d = (await r.json()).Data || {}; players = (d.clients ?? 0) + '/' + (d.sv_maxclients ?? '?'); return; }catch(e){}
  }
}
getPlayers(); setInterval(getPlayers, 30000);

function toHTML(s){
  return s.replace('{PLAYERS}', players).replace(/\{(p|ok|y)\}/g,'<span class="$1">').replace(/\{\/\}/g,'</span>');
}
function strip(s){ return s.replace('{PLAYERS}', players).replace(/\{(p|ok|y|\/)\}/g,''); }

function terminal(el, lines, leftHand){
  let li = 0;
  function nextLine(){
    if (li >= lines.length){ setTimeout(()=>{ el.innerHTML=''; li=0; nextLine(); }, 2600); return; }
    const raw = lines[li], text = strip(raw), row = document.createElement('div');
    row.className = 'line'; el.appendChild(row);
    while (el.children.length > 7) el.removeChild(el.firstChild);
    const isCmd = raw.startsWith('{p}>');
    let c = 0;
    (function type(){
      if (c <= text.length){
        row.innerHTML = text.slice(0,c).replace(/&/g,'&amp;').replace(/</g,'&lt;') + '<span class="cur"></span>';
        if (isCmd && c>0 && text[c-1] !== ' ') press(Math.random() < .5 ? leftHand : !leftHand);
        c++; setTimeout(type, isCmd ? 55+Math.random()*70 : 18);
      } else {
        row.innerHTML = toHTML(raw); li++;
        setTimeout(nextLine, isCmd ? 350 : 700);
      }
    })();
  }
  nextLine();
}
terminal(document.getElementById('tL'), TERMINAL_STANGA, true);
setTimeout(()=>terminal(document.getElementById('tR'), TERMINAL_DREAPTA, false), 1800);

/* ---------- ploaie de cod rosie ---------- */
const DPR = devicePixelRatio || 1;
function fit(c){ c.width = c.offsetWidth*DPR; c.height = c.offsetHeight*DPR; }
const rc = document.getElementById('rain'), rx = rc.getContext('2d'); fit(rc);
const FS = 11*DPR, cols = Math.floor(rc.width/FS); const drops = Array.from({length:cols},()=>Math.random()*-50);
const CH = 'RELIFE01アイウエオカキクケコ$#%&*+=<>/\\';
setInterval(()=>{
  rx.fillStyle='rgba(0,0,0,.18)'; rx.globalCompositeOperation='destination-out'; rx.fillRect(0,0,rc.width,rc.height);
  rx.globalCompositeOperation='source-over'; rx.font = `${FS}px Consolas,monospace`;
  for(let i=0;i<cols;i++){
    const y = drops[i]*FS; if (y>0){
      rx.fillStyle = Math.random()<.08 ? '#fff' : '#ff3b47';
      rx.fillText(CH[Math.random()*CH.length|0], i*FS, y);
    }
    drops[i] += .6; if (y > rc.height && Math.random() > .975) drops[i] = 0;
  }
}, 50);

/* ---------- scantei ---------- */
const ec = document.getElementById('embers'), ex = ec.getContext('2d'); fit(ec);
let E = []; function ember(){ return {x:Math.random()*ec.width,y:ec.height+10,vx:(Math.random()-.5)*.8*DPR,vy:-(0.5+Math.random()*1.8)*DPR,r:(0.6+Math.random()*2)*DPR,life:1,w:Math.random()*7}; }
for(let i=0;i<80;i++){ const e=ember(); e.y=Math.random()*ec.height; E.push(e); }
(function loopE(){ ex.clearRect(0,0,ec.width,ec.height);
  for(const e of E){ e.w+=.05; e.x+=e.vx+Math.sin(e.w)*.3*DPR; e.y+=e.vy; e.life-=.003; if(e.y<-10||e.life<=0) Object.assign(e,ember());
    const g=ex.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r*4); g.addColorStop(0,`rgba(255,150,90,${e.life})`); g.addColorStop(1,'rgba(255,40,40,0)');
    ex.fillStyle=g; ex.beginPath(); ex.arc(e.x,e.y,e.r*4,0,7); ex.fill(); }
  requestAnimationFrame(loopE); })();

/* ---------- fulgere ---------- */
const bc = document.getElementById('bolt'), bx = bc.getContext('2d'); fit(bc);
let bolts = [];
function makeBolt(){
  const side = Math.random()<.5 ? Math.random()*.3 : .7+Math.random()*.3;
  let x = side*bc.width, y = 0, pts=[[x,y]]; const step = bc.height/12;
  while(y < bc.height*(.6+Math.random()*.4)){ x += (Math.random()-.5)*step*1.4; y += step*(.6+Math.random()*.6); pts.push([x,y]); }
  bolts.push({pts, life:1});
  const fl = document.getElementById('flash'); fl.style.setProperty('--fx',(side*100)+'%'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
}
(function loopB(){ bx.clearRect(0,0,bc.width,bc.height); bx.shadowColor='#ff2830'; bx.shadowBlur=18*DPR; bx.lineCap='round';
  for(const b of bolts){ const a=Math.max(0,b.life)*(Math.random()<.2?.4:1);
    for(const w of [5,2]){ bx.beginPath(); bx.moveTo(b.pts[0][0],b.pts[0][1]); for(const q of b.pts) bx.lineTo(q[0],q[1]);
      bx.lineWidth=w*DPR; bx.strokeStyle=`rgba(255,${150+a*100|0},${150+a*100|0},${a})`; bx.stroke(); }
    b.life-=.035; }
  bolts = bolts.filter(b=>b.life>0); requestAnimationFrame(loopB); })();
(function sch(){ setTimeout(()=>{ makeBolt(); if(Math.random()<.4) setTimeout(makeBolt,140); sch(); }, 2500+Math.random()*3500); })();

/* ---------- ochi care lumineaza + glitch ---------- */
const stage = document.getElementById('stage'), box = document.getElementById('box');
(function eyes(){ setTimeout(()=>{ stage.classList.remove('eyes-on'); void stage.offsetWidth; stage.classList.add('eyes-on'); eyes(); }, 4000+Math.random()*3000); })();
(function glitch(){ setTimeout(()=>{ stage.classList.remove('glitch'); void stage.offsetWidth; stage.classList.add('glitch');
  setTimeout(()=>stage.classList.remove('glitch'),460); glitch(); }, 5000+Math.random()*4000); })();
</script>
</body>
</html>
